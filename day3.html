<!-- 10.14 코드 리뷰 리팩토링
 1. 리액트에서 on ~ 함수명 대신 set ~ 함수명 사용 권장
 2. 나누기 진행 시 버그 발생 수정
 3. result 변수명 사용 안함 -> 제거

 -> 다른 사람들 리뷰 참고 : validation 처리 신경쓰기
-->

<!DOCTYPE html>
<html>
<head>
    <title>🔥 Calculator 🔥</title>
    <meta charset="UTF-8" />
    <link
            rel="stylesheet"
            href="https://unpkg.com/@picocss/pico@1.*/css/pico.min.css"
    />
    <style>
        body {
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<div id="root"></div>
</body>
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
    function App() {
        const [index, setIndex] = React.useState('none');
        const [first, setFirst] = React.useState();
        const [second, setSecond] = React.useState();
        const [flipped, setFlip] = React.useState(false);

        const setSelect = (event) => {
            setIndex(event.target.value);
        };
        const setFirstChange = (event) => {
            setFirst(event.target.value);
        };
        const setSecondChange = (event) => {
            setSecond(event.target.value);
        };
        const setCalculate = () => {
            switch (index) {
                case 'plus':
                    setFlip(Number(first) + Number(second));
                    break;
                case 'minus':
                    setFlip(Number(first) - Number(second));
                    break;
                case 'divide':
                    setFlip(Number(first) / Number(second));
                    break;
                case 'multiply':
                    setFlip(Number(first) * Number(second));
                    break;
            }
        };

        return (
            <div className="container">
                <h1>🔥 Calculator 🔥</h1>
                <input
                    value={first}
                    type="number"
                    placeholder="👉🏻 Write a number..."
                    onChange={setFirstChange}
                ></input>
                <input
                    value={second}
                    type="number"
                    placeholder="👉🏻 And another one..."
                    onChange={setSecondChange}
                ></input>
                <select value={index} onChange={setSelect}>
                    <option value="none">👉🏻Select operation</option>
                    <option value="plus">+</option>
                    <option value="minus">-</option>
                    <option value="divide">/</option>
                    <option value="multiply">*</option>
                </select>
                <button onClick={setCalculate}>Calculate</button>
                <h1>{flipped != 0 ? 'The result is: ' + flipped : null}</h1>
            </div>
        );
    }

    const root = document.getElementById('root');
    ReactDOM.render(<App />, root);
</script>
</html>
